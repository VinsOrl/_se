<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>miniCurl · curl in your browser</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --dim: #7d8590; --green: #3fb950; --red: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text); padding: 24px;
      font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .term {
      width: min(860px, 100%); background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: 0 16px 48px rgba(0, 0, 0, .4); overflow: hidden;
    }
    .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .bar .title { margin-left: 8px; color: var(--dim); font-size: 13px; }
    #out {
      margin: 0; padding: 16px; max-height: 60vh; overflow: auto;
      white-space: pre-wrap; word-break: break-word;
    }
    .cmd { color: var(--dim); }
    .err { color: var(--red); }
    .prompt { display: flex; gap: 8px; align-items: baseline; padding: 0 16px 8px; }
    .prompt span { color: var(--green); }
    #cmd {
      flex: 1; background: none; border: none; outline: none; color: var(--text);
      font: inherit; padding: 4px 0;
    }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px 16px; }
    .examples button {
      background: #21262d; color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 12px; font: 12px/1.4 inherit; cursor: pointer;
    }
    .examples button:hover { border-color: var(--green); color: var(--green); }
    footer { padding: 10px 16px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; }
  </style>
</head>
<body>
  <div class="term">
    <div class="bar">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <span class="title">miniCurl — Rust → WebAssembly · runs in your browser</span>
    </div>
    <pre id="out" aria-live="polite"></pre>
    <div class="prompt">
      <span>minicurl&gt;</span>
      <input id="cmd" autocomplete="off" spellcheck="false" autofocus
             placeholder="https://httpbin.org/get -v" />
    </div>
    <div class="examples" id="examples"></div>
    <footer>100% client-side · cross-origin hosts must allow CORS · no server involved</footer>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
