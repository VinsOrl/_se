name: week1 miniCurl → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "week1/**"
      - ".github/workflows/week1-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo test
        working-directory: week1
        run: cargo test

  pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        working-directory: week1
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Install & run wasm-bindgen CLI (pinned to Cargo.lock)
        working-directory: week1
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$V" --quiet
          ~/.cargo/bin/wasm-bindgen \
            --target web \
            --out-dir pkg \
            target/wasm32-unknown-unknown/release/minicurl.wasm
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: week1
          destination_dir: .
          force_orphan: true
