# Inside the compose network, service names (api, python, rust) resolve via Docker DNS.
server {
    listen 80;
    server_name _;

    # Static web UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Node.js API  (URI is passed through unchanged: /api/notes -> api:3000/api/notes)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python service  (prefix stripped: /py/health -> python:5000/health)
    location /py/ {
        proxy_pass http://python:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Rust service  (prefix stripped: /rs/primes -> rust:8000/primes)
    location /rs/ {
        proxy_pass http://rust:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
