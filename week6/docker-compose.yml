name: week6-docker

services:
  # ---------- Reverse proxy + static web UI ----------
  nginx:
    build: ./nginx
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      python:
        condition: service_started
      rust:
        condition: service_started
    networks:
      - frontend
    restart: unless-stopped

  # ---------- Node.js REST API ----------
  api:
    build: ./api
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # ---------- Python service (optional) ----------
  python:
    build: ./python
    environment:
      PORT: 5000
    networks:
      - frontend
    restart: unless-stopped

  # ---------- Rust service ----------
  rust:
    build: ./rust
    environment:
      PORT: 8000
    networks:
      - frontend
    restart: unless-stopped

  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:   # nginx <-> app services
  backend:    # api <-> db (db is NOT reachable from nginx or the host)

volumes:
  pgdata:
