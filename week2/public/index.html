<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NQU Campus Portal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 data-i18n="title"></h1>
  <span class="grow"></span>
  <select id="lang" aria-label="Language"><option value="en">EN</option><option value="zh-TW">繁中</option></select>
  <button id="logout" data-i18n="logout" hidden></button>
</header>
<nav id="nav" hidden>
  <a href="#/courses" data-i18n="nav.courses"></a><a href="#/timetable" data-i18n="nav.timetable"></a>
  <a href="#/leave" data-i18n="nav.leave"></a><a href="#/grades" data-i18n="nav.grades"></a>
</nav>
<main>
  <p id="msg" role="alert"></p>
  <section id="login" hidden>
    <form id="login-form" class="card">
      <label><span data-i18n="studentId"></span><input name="student_id" autocomplete="username" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <button data-i18n="login"></button>
    </form>
  </section>
  <section id="view" hidden></section>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
